# Same pipelines as the cluster collector, each signal sent to its own Victoria backend.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/metrics:
    endpoint: http://victoria-metrics:8428/opentelemetry
  otlphttp/logs:
    endpoint: http://victoria-logs:9428/insert/opentelemetry
  otlphttp/traces:
    endpoint: http://victoria-traces:10428/insert/opentelemetry

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
