name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  git-check:
    name: Git
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      version-file: Directory.Build.props
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de

  image-publication:
    name: "Image ${{ matrix.name }}"
    needs: git-check
    if: github.event_name == 'workflow_dispatch' || needs.git-check.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - name: "Blazor App"
            image-name: "keeptrack-blazorapp"
            image-definition: "src/BlazorApp/Dockerfile"
          - name: "Web Api"
            image-name: "keeptrack-webapi"
            image-definition: "src/WebApi/Dockerfile"
    permissions:
      id-token: write
      contents: read
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: ${{ matrix.image-definition }}
      image-name: ${{ matrix.image-name }}
      image-path: ${{ vars.CONTAINER_REGISTRY_PATH }}
      image-tag: "${{ needs.git-check.outputs.version-major-minor }}.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
    secrets:
      container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
