# IstarCI configuration, read from the root of the repository.

runner:
  image: ghcr.io/devpro/ubuntu-dotnet:latest
  images:
    "git-check*": ghcr.io/devpro/debian-node:latest
    "markup-lint*": ghcr.io/devpro/debian-node:latest
    "image-scan*": ghcr.io/devpro/debian-node:latest
  # The scan jobs build an image and scan it through the host Docker daemon.
  docker: true

workflow:
  # Delivery and deployment publish or hold credentials, which a local run must never reach.
  exclude:
    - pkg.yaml
