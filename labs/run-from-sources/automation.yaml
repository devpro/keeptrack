version: 1

defaults:
  # ms per step primitive, long enough for a save waiting on a reference data provider
  timeout: 20000

# One page, so every action drives the same tab and keeps its session cookie and its Blazor circuit.
# The selectors are those of the end-to-end page objects in test/BlazorApp.PlaywrightTests/Pages.
pages:
  app:
    url: "http://localhost:5207/"
    selectors:
      email: { label: "Email" }
      role: { label: "Role" }
      signIn: { role: button, name: "Sign in", exact: true }
      # The sidebar, since the call to action of Home also holds the word "Movies"
      nav: "nav.flex-column"
      moviesLink: { role: link, name: "Movies", exact: true, within: nav }
      tvShowsLink: { role: link, name: "TV shows", exact: true, within: nav }
      videoGamesLink: { role: link, name: "Video games", exact: true, within: nav }
      watchNextLink: { role: link, name: "Watch next", exact: true, within: nav }
      moviesHeading: { role: heading, name: "My Movies", exact: true }
      tvShowsHeading: { role: heading, name: "My TV Shows", exact: true }
      videoGamesHeading: { role: heading, name: "My Video Games", exact: true }
      watchNextHeading: { role: heading, name: "Watch next", exact: true }
      add: { role: button, name: "+ Add", exact: true }
      form: ".kt-form-card"
      title: { testid: "title-input" }
      year: { testid: "year-input" }
      save: { role: button, name: "Save", exact: true }
      detailTitle: ".kt-title-input"
      current: { role: button, name: "Current", exact: true }
      # The list opens on the latest season, so the first row is episode 1 of the season tab selected
      seasonOne: { role: button, name: "S01", exact: true }
      firstEpisode: ":nth-match(.kt-episode-row input[type=checkbox], 1)"
      watchlist: { role: button, name: "Watchlist", exact: true }
      showCard: { text: "Severance" }
      moviesTab: { role: button, name: "Movies" }
      checkMatch: { role: button, name: "Check for reference match" }
      linked: { text: "Linked!", exact: true }
      movieCard: { text: "The Matrix" }

# Sidebar navigation rather than a goto, so each page arrives over a circuit already connected.
actions:
  tour.sign-in:
    page: app
    steps:
      - goto: "http://localhost:5207/account/login"
      - fill: { target: email, value: "${DEMO_EMAIL}" }
      - select: { target: role, value: "member" }
      - click: signIn
      - waitFor: { target: videoGamesLink }

  tour.add-tv-show:
    page: app
    steps:
      - click: tvShowsLink
      - waitFor: { target: tvShowsHeading }
      - click: add
      - waitFor: { target: form }
      - fill: { target: title, value: "Severance" }
      - fill: { target: year, value: "2022" }
      - click: save
      - waitFor: { target: detailTitle }

  tour.watch-first-episode:
    page: app
    steps:
      - click: current
      - click: seasonOne
      - waitFor: { target: firstEpisode }
      - click: firstEpisode

  tour.add-movie:
    page: app
    steps:
      - click: moviesLink
      - waitFor: { target: moviesHeading }
      - click: add
      - waitFor: { target: form }
      - fill: { target: title, value: "The Matrix" }
      - fill: { target: year, value: "1999" }
      - click: save
      - waitFor: { target: detailTitle }
      - click: watchlist

  tour.add-video-game:
    page: app
    steps:
      - click: videoGamesLink
      - waitFor: { target: videoGamesHeading }
      - click: add
      - waitFor: { target: form }
      - fill: { target: title, value: "Hollow Knight" }
      - fill: { target: year, value: "2007" }
      - click: save
      - waitFor: { target: detailTitle }

  # The year is saved when its field loses focus, which Tab does.
  tour.fix-video-game-year:
    page: app
    steps:
      - fill: { target: year, value: "2017" }
      - press: { target: year, key: "Tab" }
      - click: checkMatch
      - expect: { target: linked, toBeVisible: true, hint: "No link yet: set the year to 2017, then check again." }

  tour.watch-next:
    page: app
    steps:
      - click: watchNextLink
      - waitFor: { target: watchNextHeading }
      - expect: { target: showCard, toBeVisible: true, hint: "Severance is not in Watch next: add it and tick its first episode." }

  tour.watch-next-movies:
    page: app
    steps:
      - click: moviesTab
      - expect: { target: movieCard, toBeVisible: true, hint: "The Matrix is not in Watch next: add it to the watchlist." }
